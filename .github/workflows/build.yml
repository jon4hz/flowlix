name: build

on:
  push:
    branches: [main, master]
  pull_request:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build binary in container
        run: ./scripts/build-in-docker.sh
        env:
          CONTAINER_ENGINE: docker

      - name: Sanity-check the artifact
        run: |
          file prebuilt/linux_amd64/FlowtoysUpdater
          test -x prebuilt/linux_amd64/FlowtoysUpdater

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlowtoysUpdater-linux-amd64
          path: prebuilt/linux_amd64/FlowtoysUpdater
